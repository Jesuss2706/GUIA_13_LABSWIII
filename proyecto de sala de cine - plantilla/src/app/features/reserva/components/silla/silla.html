<button
  type="button"
  class="silla"
  [class.silla--seleccionada]="estado() === 'seleccionada'"
  [class.silla--ocupada]="estado() === 'ocupada'"
  [class.silla--preferencial]="silla().tipo === 'preferencial'"
  [style.--color-silla]="color()"
  [attr.aria-pressed]="estado() === 'seleccionada'"
  [attr.aria-disabled]="estado() === 'ocupada'"
  [attr.aria-label]="etiqueta()"
  [title]="etiqueta()"
  (click)="notificar()"
>
  <span class="silla_numero">{{ silla().numero }}</span>
</button>
